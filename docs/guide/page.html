<title>$pagetitle$</title>
<style>
/* The palette, radii and fonts of the registry's web pages
   (internal/web/static/style.css), so the docs look like the same product.
   No script and no external files: the site's CSP allows inline style only. */
:root {
  color-scheme: light dark;
  --ground: #f5f5f7;
  --panel: #ffffff;
  --panel-alt: #fafafc;
  --sidebar: #ececf0;
  --sidebar-line: #dcdce1;
  --sidebar-hover: #e8e8ed;
  --line: #e5e5ea;
  --line-soft: #efeff4;
  --field-line: #d2d2d7;
  --text: #1d1d1f;
  --text-2: #515154;
  --muted: #6e6e73;
  --muted-2: #5b5b60;
  --link: #0066cc;
  --code-bg: #f5f5f7;
  --inline-code: #efeff4;
  --own-bg: #e8f0fb;
  --own-text: #004f9e;
  --fix-bg: #ececf0;
  --fix-text: #3a3a3c;
  --segment: #e3e3e8;
  --segment-on: #ffffff;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #111113;
    --panel: #1c1c1e;
    --panel-alt: #202023;
    --sidebar: #19191b;
    --sidebar-line: #2e2e32;
    --sidebar-hover: #2a2a2e;
    --line: #2f2f33;
    --line-soft: #2a2a2d;
    --field-line: #46464b;
    --text: #f5f5f7;
    --text-2: #c7c7cc;
    --muted: #a1a1a6;
    --muted-2: #a1a1a6;
    --link: #4aa3ff;
    --code-bg: #111113;
    --inline-code: #2a2a2d;
    --own-bg: #1a2e47;
    --own-text: #8cc4ff;
    --fix-bg: #2c2c30;
    --fix-text: #d1d1d6;
    --segment: #2a2a2d;
    --segment-on: #4a4a4f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font: 0.9375rem/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: 12px; top: -48px; z-index: 10; padding: 8px 12px; border-radius: 8px; background: var(--panel); }
.skip:focus { top: 12px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Shell: a sidebar with the contents beside the page on wide screens. */
.app { display: flex; min-height: 100vh; }
.side {
  width: 264px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding: 20px 12px 32px; background: var(--sidebar); border-right: 1px solid var(--sidebar-line);
}
.brand {
  display: flex; align-items: center; gap: 8px; padding: 0 10px 18px;
  color: var(--text); font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.2px;
}
.brand:hover { text-decoration: none; }
.brand span { color: var(--muted-2); font-weight: 400; }
/* Guide and What's new: two pages of one site, switched like the
   registry's tabs. The page shown is aria-current. */
.switch { display: flex; gap: 2px; padding: 2px; background: var(--segment); border-radius: 9px; }
.switch a {
  flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 30px; padding: 0 12px;
  border-radius: 7px; color: var(--text); font-size: 0.8125rem; white-space: nowrap;
}
.switch a:hover { text-decoration: none; background: var(--sidebar-hover); }
.switch a[aria-current="page"] { background: var(--segment-on); font-weight: 600; box-shadow: var(--shadow); }
.side .switch { margin: 0 4px 14px; }
.side-label { padding: 8px 10px 4px; font-size: 0.6875rem; font-weight: 600; color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.4px; }
.toc ul { list-style: none; margin: 0; padding: 0; }
.toc a {
  display: flex; align-items: center; min-height: 30px; padding: 4px 10px;
  border-radius: 8px; color: var(--text); font-size: 0.875rem; line-height: 1.3;
}
.toc a:hover { background: var(--sidebar-hover); text-decoration: none; }
/* The guide's one h1 is the page title, not an entry. */
.toc > ul > li > a { display: none; }
.toc ul ul a { min-height: 28px; font-size: 0.8125rem; color: var(--text-2); }
.doc .toc ul { margin: 0; padding: 0; }
.doc .toc li { margin: 0; }

.main { flex-grow: 1; min-width: 0; padding: 28px 36px 64px; }
.doc {
  max-width: 820px; margin: 0 auto; padding: 36px 44px 44px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
}
.mobile-toc { display: none; }

/* Text */
.doc h1 { margin: 0 0 12px; font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; line-height: 1.15; }
.doc h2 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.3px; line-height: 1.25; }

/* Chapters: each level-2 section folds */
details.chapter { border-top: 1px solid var(--line); }
.chapter-fixed { padding: 16px 0 4px; border-top: 1px solid var(--line); }
.chapter-fixed h2 { margin-bottom: 10px; }
details.chapter:last-of-type { border-bottom: 1px solid var(--line); }
details.chapter > summary {
  display: flex; align-items: center; gap: 10px; padding: 16px 4px; cursor: pointer;
  list-style: none; border-radius: 8px;
}
details.chapter > summary::-webkit-details-marker { display: none; }
details.chapter > summary::before {
  content: ""; flex: none; width: 8px; height: 8px; margin: 0 4px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: rotate(-45deg); transition: transform 0.15s ease;
}
details.chapter[open] > summary::before { transform: rotate(45deg); }
details.chapter > summary:hover { background: var(--line-soft); }
details.chapter > summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.chapter-body { padding: 0 4px 24px; }
.chapter-body > :first-child { margin-top: 0; }
.chapter-tools { display: flex; gap: 8px; justify-content: flex-end; margin: 16px 0 8px; }
.chapter-tools[hidden] { display: none; }
.chapter-tools button {
  min-height: 32px; font: inherit; font-size: 0.8125rem; padding: 0 14px; border-radius: 8px; cursor: pointer;
  color: var(--text); background: var(--panel); border: 1px solid var(--field-line);
}
.chapter-tools button:hover { background: var(--line-soft); }
@media (prefers-reduced-motion: reduce) { details.chapter > summary::before, .mobile-toc summary::before { transition: none; } }
.doc h3 { margin: 28px 0 8px; font-size: 1.0625rem; font-weight: 600; line-height: 1.3; }
.doc h1 + p { font-size: 1.0625rem; color: var(--text-2); }
.doc h2, .doc h3 { scroll-margin-top: 16px; }
.doc h2:target, .doc h3:target { color: var(--own-text); }
.doc p, .doc ul, .doc ol { margin: 0 0 12px; }
.doc ul, .doc ol { padding-left: 22px; }
.doc li { margin: 4px 0; }
.doc li > p { margin: 0; }
.doc strong { font-weight: 600; }

code { font-family: var(--mono); font-size: 0.84em; }
:not(pre) > code {
  padding: 1px 5px; border-radius: 5px; background: var(--inline-code);
  overflow-wrap: anywhere;
}
pre {
  margin: 0 0 16px; padding: 12px 14px; overflow-x: auto;
  background: var(--code-bg); border: 1px solid var(--line-soft); border-radius: 10px;
  font-size: 0.8125rem; line-height: 1.55; tab-size: 4;
}
pre code { font-size: inherit; white-space: pre; }

/* Tables look like the registry's lists, and scroll inside themselves. */
.table { margin: 0 0 16px; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; line-height: 1.45; }
th {
  padding: 9px 14px; text-align: left; vertical-align: bottom;
  font-size: 0.75rem; font-weight: 600; color: var(--muted); background: var(--panel-alt);
}
td { padding: 9px 14px; border-top: 1px solid var(--line); vertical-align: top; }
td code { white-space: nowrap; }
.doc li .table { margin-top: 8px; }

/* What's new: a rule above each month, the day under it, and items that
   start with their tag. The word carries the meaning; the colour only helps
   the eye find features among fixes. */
.tag {
  display: inline-block; min-width: 4.5rem; margin-right: 4px; padding: 0 8px; border-radius: 6px;
  font-size: 0.75rem; font-weight: 600; line-height: 1.6rem; text-align: center; vertical-align: 1px;
}
.tag-feature { background: var(--own-bg); color: var(--own-text); }
.tag-fix { background: var(--fix-bg); color: var(--fix-text); }
.changes .doc h2 { margin: 32px 0 0; padding-top: 24px; border-top: 1px solid var(--line); }
/* A day sits under its month: smaller and quieter, so the two never read
   as the same level, even where the month heading shrinks on phones. */
.changes .doc h3 { margin: 20px 0 10px; font-size: 0.9375rem; color: var(--text-2); }
.changes .doc ul { list-style: none; padding-left: 0; }
.changes .doc li { margin: 0 0 10px; }
@media (min-width: 901px) {
  /* Tags hang in a column of their own, so the sentences line up. */
  .changes .doc li { position: relative; padding-left: 5.25rem; }
  .changes .tag { position: absolute; left: 0; top: 0; }
}

/* Phones and narrow windows: contents on top, the page edge to edge. */
@media (max-width: 900px) {
  .app { display: block; }
  .side { display: none; }
  .main { padding: 0; }
  body { background: var(--panel); }
  .doc { max-width: none; padding: 20px 16px 48px; border: 0; border-radius: 0; }
  .mobile-toc { display: block; padding: 0; margin: 0 0 8px; }
  .mobile-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--sidebar); border-bottom: 1px solid var(--sidebar-line); }
  .mobile-top .brand { padding: 0; }
  /* Below about 330 px the switch wraps under the brand rather than
     pushing the page sideways. */
  .mobile-top { flex-wrap: wrap; gap: 8px 12px; padding: 10px 16px; }
  .mobile-top .switch { margin-left: auto; }
  .mobile-toc details { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-alt); }
  .mobile-toc summary { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; font-weight: 600; cursor: pointer; list-style: none; border-radius: 10px; }
  .mobile-toc summary::-webkit-details-marker { display: none; }
  .mobile-toc summary::before {
    content: ""; flex: none; width: 7px; height: 7px; margin: 0 3px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg); transition: transform 0.15s ease;
  }
  .mobile-toc details[open] > summary::before { transform: rotate(45deg); }
  .mobile-toc .toc { padding: 0 8px 10px; }
  .mobile-toc .toc a:hover { background: var(--line-soft); }
  .doc h1 { font-size: 1.625rem; }
  .doc h2 { font-size: 1.125rem; }
  td code { white-space: normal; overflow-wrap: anywhere; }
}
@media (min-width: 901px) { .mobile-top { display: none; } }
/* Touch screens: every link and button at least 44 px tall. */
@media (pointer: coarse) {
  .toc a, .toc ul ul a, .chapter-tools button, .switch a { min-height: 44px; }
}
/* Increased contrast: stronger secondary text and separators. */
@media (prefers-contrast: more) {
  :root { --muted: #515154; --muted-2: #3a3a3c; --line: #aeaeb2; --line-soft: #c7c7cc; --field-line: #8a8a8e; --fix-text: #1d1d1f; }
  .tag { box-shadow: inset 0 0 0 1px currentColor; }
  .switch { box-shadow: inset 0 0 0 1px var(--line); }
}
@media (prefers-contrast: more) and (prefers-color-scheme: dark) {
  :root { --muted: #d1d1d6; --muted-2: #d1d1d6; --line: #636366; --line-soft: #48484a; --field-line: #8e8e93; --fix-text: #f5f5f7; }
}
</style>
