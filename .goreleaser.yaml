# GoReleaser v2 config. Validate with `goreleaser check`.
# Repo owner "petervlad" appears in release.github, homebrew_casks.repository
# and homepage below; change all three if the repo moves.
version: 2

project_name: loadout

before:
  hooks:
    - go mod verify

builds:
  - id: loadout
    main: ./cmd/loadout
    binary: loadout
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.packaged=true
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: loadout
    ids: [loadout]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive, made by syft (the release workflow installs it).
# `goreleaser ... --skip=sbom` builds without it where syft is missing.
sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: petervlad
    name: loadout
  draft: false
  prerelease: auto

homebrew_casks:
  - name: loadout
    ids: [loadout]
    binaries: [loadout]
    homepage: https://github.com/petervlad/loadout
    description: Share your team's AI agents across every AI tool.
    repository:
      owner: petervlad
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "loadout {{ .Tag }}"
    # auto skips snapshots and prereleases. A release tag needs
    # HOMEBREW_TAP_TOKEN with write access to the tap.
    skip_upload: auto
    hooks:
      post:
        # Binaries are not notarized; drop the quarantine flag so macOS runs them.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/loadout"]
          end
