name: release

on:
  push:
    tags: ["v*"]

# Per job below: the release job writes releases, and attestations need the
# OIDC token. Nothing else gets more than read.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog needs full history and tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
      - run: go test -race ./...
      - run: sh scripts/notices.sh --check
      # syft makes the SBOMs that .goreleaser.yaml asks for.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with contents: write on the Homebrew tap
          # repository. Unused while the cask has skip_upload: true
          # (.goreleaser.yaml); an unset secret is an empty string, which is
          # fine then.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Build provenance for every archive, SBOM and the checksum file.
      # Verify with: gh attestation verify FILE --repo OWNER/REPO
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
