start: plan
slots:
  plan:
    brief: Turn the ticket into plan.md.
    writes: plan.md
    reads: [ticket]
    verdicts: [READY]
  build:
    brief: Implement the plan on a branch.
    writes: build.md
    reads: [plan.md, ticket]
    verdicts: [DONE, PLAN DOES NOT FIT]
  review:
    brief: Judge the change against the plan.
    writes: review.md
    reads: [plan.md, build.md, ticket]
    verdicts: [APPROVE, CHANGES REQUESTED]
edges:
  - {from: plan,   on: READY,             to: build,  via: gate}
  - {from: build,  on: DONE,              to: review, via: auto}
  - {from: build,  on: PLAN DOES NOT FIT, to: plan,   via: gate}
  - {from: review, on: APPROVE,           to: end,    via: gate}
  - {from: review, on: CHANGES REQUESTED, to: build,  via: gate, max_rounds: 2}
